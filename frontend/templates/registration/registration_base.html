{% extends "base.html" %}

{% load sass_tags %}

{% block extra_js %}
<script type="text/javascript">
var $j = jQuery.noConflict();
function getQueryVariable(variable) {
    var query = window.location.search.substring(1);
    var vars = query.split("&");
    for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == variable) {
            return pair[1];
        }
    }
    return null;
}
$j(document).ready(function() {
    var next = getQueryVariable('next');
    var saved_next = $j.cookie('next');
    if(next!=null) {
        next = next.replace(/[\x22\x27\x3c\x3e]/g,'');
        $j.cookie('next', next, {path: '/'});
    } else if(saved_next!=null){
        var do_next = $j('#link-to-next');
        // Go to /next/ and let the server read the cookie, rather than
        // navigating to its value here. That value is attacker-influencable:
        // the branch above stores whatever ?next= the current URL carries,
        // stripping only "'<>, so a lure like
        // /accounts/register/?next=//evil.example survives it intact and the
        // welcome page (the only template with #link-to-next) would then
        // carry a freshly-registered user straight off the site. Navigating
        // to a constant same-origin path removes the sink entirely, which is
        // sturdier than trying to validate a URL in JavaScript; frontend's
        // next() view already validates the cookie against the request's own
        // host and scheme, and clears it. See issue #1261.
        if (do_next.length) window.location.replace('/next/');
    }
});
</script>

{% endblock %}

{% block extra_head %}
	<link href="{% sass_src 'scss/documentation2.scss' %}" rel="stylesheet" type="text/css" />
{% block extra_extra_head %}
    <link type="text/css" rel="stylesheet" href="{% sass_src 'scss/registration2.scss' %}" />
{% endblock %}
{% endblock %}

{% block content %}
<div id="registration">
<div id="login_centerer">
<div id="login">
{% block doccontent %}
{% endblock %}
</div>
</div>
</div>
<div class="spacer"></div>
{% endblock %}
