{% extends "base.html" %}

{% load sass_tags %}

{% block extra_js %}
<script type="text/javascript">
var $j = jQuery.noConflict();
function getQueryVariable(variable) {
    var query = window.location.search.substring(1);
    var vars = query.split("&");
    for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] == variable) {
            return pair[1];
        }
    }
    return null;
}
// True only for a same-site path: one leading slash, and not "//host" or
// "/\host", both of which browsers treat as off-site. Values reaching here are
// sometimes percent-encoded (%2Fwork%2F1%2F from the auth_next tag) and
// sometimes not (/accounts/... from Django's @login_required), so decode before
// checking -- but store the original, since decoding is only for the test.
function isSameSitePath(value) {
    var decoded;
    try {
        decoded = decodeURIComponent(value);
    } catch (e) {
        return false;
    }
    return decoded.charAt(0) === '/' &&
           decoded.charAt(1) !== '/' && decoded.charAt(1) !== '\\';
}
$j(document).ready(function() {
    var next = getQueryVariable('next');
    var saved_next = $j.cookie('next');
    if(next!=null) {
        next = next.replace(/[\x22\x27\x3c\x3e]/g,'');
        // Only store a same-site path. This is the one place where a value out
        // of the URL bar becomes a stored redirect destination, so it is worth
        // refusing an off-site one here as well as on every read. The reads
        // remain the authoritative boundary -- this cannot be, since anyone can
        // set a cookie without running this script.
        if (isSameSitePath(next)) {
            $j.cookie('next', next, {path: '/'});
        }
    } else if(saved_next!=null){
        var do_next = $j('#link-to-next');
        // Go to /next/ and let the server decide, rather than navigating to
        // the cookie value here: that value is client-writable, so this would
        // otherwise be an off-site hop. See frontend.views.next.
        if (do_next.length) window.location.replace('/next/');
    }
});
</script>

{% endblock %}

{% block extra_head %}
	<link href="{% sass_src 'scss/documentation2.scss' %}" rel="stylesheet" type="text/css" />
{% block extra_extra_head %}
    <link type="text/css" rel="stylesheet" href="{% sass_src 'scss/registration2.scss' %}" />
{% endblock %}
{% endblock %}

{% block content %}
<div id="registration">
<div id="login_centerer">
<div id="login">
{% block doccontent %}
{% endblock %}
</div>
</div>
</div>
<div class="spacer"></div>
{% endblock %}
